name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [metaphysicist1/review-workflow]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. Never connect PR code to live services.
      NEXT_PUBLIC_SITE_URL: https://review.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: review-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: review-placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://posthog.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Generate route types and check TypeScript
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test
      - name: Build Cloudflare worker (no deploy)
        run: pnpm exec opennextjs-cloudflare build
